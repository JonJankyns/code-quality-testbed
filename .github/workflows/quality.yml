name: quality

# Runs on every push (advisory on feature branches) and on every PR
# targeting staging (blocking there via the staging-quality-gate ruleset).
on:
  push:
  pull_request:
    branches: [staging]

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff pyright pytest
      - name: ruff lint
        run: ruff check src tests
      - name: ruff format check
        run: ruff format --check src tests
      - name: pyright
        run: pyright src
      - name: pytest
        run: pytest -q

  javascript:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: eslint
        run: npx --yes eslint@latest web/
      - name: prettier check
        run: npx --yes prettier@latest --check "web/**/*.js"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
